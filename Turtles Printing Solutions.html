<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turtles Printing Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f1;--surface:#fff;--ink:#1d2b24;--muted:#5a6b62;--line:#cfdccf;--shell:#1f6b4f;--shell-ink:#fff;--sun:#f2a33a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--surface:#1b2620;--ink:#eaf3ec;--muted:#9bb0a3;--line:#2e4036;--shell:#4fbf94;--shell-ink:#0d1d15}}
:root[data-theme="dark"]{--bg:#121a16;--surface:#1b2620;--ink:#eaf3ec;--muted:#9bb0a3;--line:#2e4036;--shell:#4fbf94;--shell-ink:#0d1d15}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
a{color:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1000px;margin:auto}
.brand{font-size:1.15rem;text-decoration:none;color:var(--shell)}
nav a{margin-left:18px;text-decoration:none;font-weight:700;color:var(--muted)}
nav a:hover{color:var(--ink)}
main{max-width:1000px;margin:auto;padding:0 20px 56px}
.btn{display:inline-block;background:var(--shell);color:var(--shell-ink);border:0;border-radius:999px;padding:14px 30px;font:600 1.1rem Fredoka,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{text-align:center;padding-top:10px}
.hero h1{font-size:clamp(2rem,6vw,3.4rem)}
.hero p{color:var(--muted);margin:10px auto 22px;max-width:46ch}
.hero img{display:block;width:100%;max-width:880px;margin:0 auto 26px;border-radius:22px;border:4px solid var(--surface);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;display:block}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.card div{padding:16px 18px 20px}
.card p{margin:6px 0 0;color:var(--muted)}
.crumb{display:inline-block;margin:6px 0 14px;color:var(--muted);text-decoration:none;font-weight:700}
.prod{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;align-items:start}
.main-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;border:1px solid var(--line);display:block}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumbs button{padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;width:76px;height:58px;cursor:pointer;background:none}
.thumbs button[aria-pressed="true"]{border-color:var(--shell)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
fieldset{border:0;padding:0;margin:22px 0 0}
legend,label.l{font:600 1.05rem Fredoka,sans-serif;margin-bottom:8px;display:block;padding:0}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.size input{position:absolute;opacity:0}
.size span{display:block;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer}
.size b{display:block;font:600 1.2rem Fredoka,sans-serif}
.size small{color:var(--muted)}
.size input:checked+span{border-color:var(--shell);box-shadow:0 0 0 3px color-mix(in srgb,var(--shell) 25%,transparent)}
.size input:focus-visible+span{outline:3px solid var(--sun)}
.colorrow{display:flex;gap:12px;align-items:center}
.chip{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background-size:cover;flex:none}
select{flex:1;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px;font-size:1.05rem}
.total strong{font:600 2rem Fredoka,sans-serif}
.note{color:var(--muted);font-size:.92rem;margin-top:10px}
footer{text-align:center;color:var(--muted);padding:20px;font-size:.9rem}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.line .info small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px;grid-column:2}
.lp{grid-column:3;text-align:right}
.qty button,.rm{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--ink);font-size:1.1rem;cursor:pointer}
.rm{border:0;color:var(--muted)}
@media(min-width:561px){.line{grid-template-columns:auto 1fr auto auto auto}.qty{grid-column:auto;order:3}.lp{grid-column:auto;order:4;min-width:3ch}.rm{order:5}}
#cartlink{background:var(--shell);color:var(--shell-ink);padding:6px 14px;border-radius:999px}
</style></head>

const SW=IMG.sw;
const COLORS=["Black","Red","Yellow","Orange","Rainbow","Blue","Green","Gray"];
const SIZES={small:{name:"Small",holds:3,price:6},large:{name:"Large",holds:6,price:10}};
const PRODUCTS={
 angled:{title:"Angled Scentsy pack holder",blurb:"Packs lean back at an angle so every label is easy to read and grab.",imgs:[IMG.a1,IMG.a2]},
 ninety:{title:"Scentsy 90 degree holder",blurb:"Packs stand upright in snug slots, side by side, to save counter space.",imgs:[IMG.b1,IMG.b2]}
};
const app=document.getElementById("app");
const $=(s,r=document)=>r.querySelector(s);
let CART=[];try{CART=JSON.parse(localStorage.getItem("tps_cart")||"[]")}catch(e){}
const count=()=>{$("#cartlink").textContent="Cart ("+CART.reduce((a,i)=>a+i.q,0)+")"};
const save=()=>{try{localStorage.setItem("tps_cart",JSON.stringify(CART))}catch(e){}count()};
function addItem(p,s,c){const f=CART.find(i=>i.p==p&&i.s==s&&i.c==c);f?f.q++:CART.push({p,s,c,q:1});save()}
function cart(){
 if(!CART.length){app.innerHTML=`<h1 style="font-size:2rem;margin:10px 0 12px">Your cart</h1><p style="color:var(--muted)">Your cart is empty.</p><a class="btn" href="#products">Shop Scentsy products</a>`;return}
 const sub=CART.reduce((a,i)=>a+SIZES[i.s].price*i.q,0);
 app.innerHTML=`<h1 style="font-size:2rem;margin:10px 0 16px">Your cart</h1>`+CART.map((i,x)=>`<div class="line"><span class="chip" style="background-image:url(${SW[i.c]})"></span><div class="info"><b>${PRODUCTS[i.p].title}</b><br><small>${SIZES[i.s].name} (holds ${SIZES[i.s].holds}) &middot; ${i.c}</small></div><button class="rm" data-x="${x}" data-d="0" aria-label="Remove item">&#10005;</button><div class="qty"><button data-x="${x}" data-d="-1" aria-label="Fewer">&minus;</button><span>${i.q}</span><button data-x="${x}" data-d="1" aria-label="More">+</button></div><b class="lp">$${SIZES[i.s].price*i.q}</b></div>`).join("")+`<div class="total"><span>Subtotal</span><strong>$${sub}</strong></div><p class="note">Shipping is calculated at checkout.</p>
 <!-- CHECKOUT SLOT: the global CART array holds {p:product, s:size, c:color, q:quantity}. Replace this button with your payment checkout. -->
 <div id="checkout-slot" style="margin-top:14px"><button class="btn" disabled style="width:100%">Checkout coming soon</button></div>
 <a class="crumb" href="#products" style="margin-top:14px">&larr; Keep shopping</a>`;
 app.onclick=e=>{const b=e.target.closest("[data-x]");if(!b)return;const x=+b.dataset.x,d=+b.dataset.d;if(d===0)CART.splice(x,1);else{CART[x].q+=d;if(CART[x].q<1)CART.splice(x,1)}save();cart()};
}
function home(){
 app.innerHTML=`<section class="hero">
 <h1>Useful things, printed with care</h1>
 <p>Custom 3D printed organizers made one at a time.</p>
 <img src="${IMG.hero}" alt="Scentsy wax packs in colorful 3D printed holders around a warmer">
 <a class="btn" href="#products">Scentsy products</a></section>`;
}
function products(){
 app.innerHTML=`<h2 style="font-size:2rem;margin-top:10px">Scentsy products</h2>
 <p style="color:var(--muted)">Pick a holder to choose your size and color.</p>
 <div class="grid">`+Object.entries(PRODUCTS).map(([id,p])=>`
 <a class="card" href="#product/${id}"><img src="${p.imgs[0]}" alt="${p.title}"><div><h3>${p.title}</h3><p>From $6 &middot; 2 sizes &middot; 8 colors</p></div></a>`).join("")+`</div>`;
}
function product(id){
 const p=PRODUCTS[id]; if(!p) return products();
 app.innerHTML=`<a class="crumb" href="#products">&larr; Scentsy products</a>
 <div class="prod"><div>
  <img class="main-img" id="main" src="${p.imgs[0]}" alt="${p.title}">
  <div class="thumbs">${p.imgs.map((s,i)=>`<button aria-pressed="${i==0}" aria-label="Photo ${i+1}" data-i="${i}"><img src="${s}" alt=""></button>`).join("")}</div>
 </div><div>
  <h1 style="font-size:2rem">${p.title}</h1>
  <p style="color:var(--muted)">${p.blurb}</p>
  <fieldset><legend>Size</legend><div class="sizes">`+Object.entries(SIZES).map(([k,s],i)=>`
   <label class="size"><input type="radio" name="size" value="${k}" ${i==0?"checked":""}><span><b>${s.name} &ndash; $${s.price}</b><small>Holds ${s.holds} packs</small></span></label>`).join("")+`</div></fieldset>
  <div style="margin-top:22px"><label class="l" for="color">Color</label>
   <div class="colorrow"><span class="chip" id="chip"></span>
   <select id="color">${COLORS.map(c=>`<option>${c}</option>`).join("")}</select></div></div>
  <div class="total"><span id="sum"></span><strong id="price"></strong></div>
  <button class="btn" id="add" style="width:100%">Add to cart</button>
  <p class="note" id="added" aria-live="polite">Shipping is calculated at checkout.</p>
 </div></div>`;
 const upd=()=>{const s=SIZES[$('input[name=size]:checked').value],c=$("#color").value;
  $("#price").textContent="$"+s.price;$("#sum").textContent=s.name+" (holds "+s.holds+"), "+c;
  $("#chip").style.backgroundImage=`url(${SW[c]})`;};
 app.onchange=upd;upd();
 $("#add").onclick=()=>{addItem(id,$('input[name=size]:checked').value,$("#color").value);$("#added").innerHTML='Added to cart! <a href="#cart">View cart</a> or keep shopping.'};
 document.querySelectorAll(".thumbs button").forEach(b=>b.onclick=()=>{
  $("#main").src=p.imgs[b.dataset.i];
  document.querySelectorAll(".thumbs button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
}
function route(){
 const h=location.hash.slice(1)||"home";app.onchange=null;app.onclick=null;count();
 if(h.startsWith("product/"))product(h.split("/")[1]);else if(h==="products")products();else if(h==="cart")cart();else home();
 scrollTo(0,0);
}
addEventListener("hashchange",route);route();
</script></body></html>
